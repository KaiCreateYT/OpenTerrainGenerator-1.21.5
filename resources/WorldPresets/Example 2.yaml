# WorldPreset: defines a complete world with OTG dimensions.
# See "Example 4.yaml" for full documentation and all available options.
#
# This config creates a vanilla "flat" overworld, and adds a custom
# dimension using the "VanillaVistas" preset.
# Note: The NonOTGGeneratorSettings setting can be used to add a
# generator-settings JSON string for the "flat" overworld.
---
Overworld:
  NonOTGWorldType: "flat"
  NonOTGGeneratorSettings:
Dimensions:
- PresetFolderName: "VanillaVistas"
